<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うどん桶 カメラ軌道シミュレーター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:13px;color:#2c2c2a;overflow:hidden;height:100vh;width:100vw}

/* ── Viewport (fullscreen) ── */
#viewport{position:fixed;inset:0;background:#111;transition:all .2s}
canvas{display:block;width:100%!important;height:100%!important}

/* ── HUD ── */
#hud{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.65);color:#f5e8c0;border-radius:8px;padding:8px 13px;font-size:12px;line-height:2.0;pointer-events:none;z-index:10}
#hud-angle{font-size:22px;font-weight:500;color:#f0c857;line-height:1.2;margin-bottom:2px}
#hud-lens{color:#aee4ff}
#hud-fov{font-size:11px;color:#999}
#hud-extras{color:#b8f0b8;font-size:11px}
#filmframe{position:fixed;inset:0;pointer-events:none;border:3px solid rgba(0,0,0,.35);z-index:5}
#filmframe::before{content:'';position:absolute;inset:8px;border:1px solid rgba(255,255,255,.12);border-radius:2px}

/* ── Zoom buttons ── */
#zoom-btns{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:20}
#zoom-btns button{width:40px;height:40px;border-radius:50%;border:0.5px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
#zoom-btns button:hover{background:rgba(0,0,0,.75)}
#zoom-val{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateX(100px);color:rgba(255,255,255,.5);font-size:12px;z-index:20;pointer-events:none}

/* ── Floating panel — default bottom-left, below HUD ── */
#panel{position:fixed;bottom:14px;left:14px;top:auto;right:auto;width:270px;background:rgba(245,244,240,.97);border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.35);z-index:30;user-select:none;max-height:calc(100vh - 200px);overflow-y:auto}
#panel-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px;border-bottom:0.5px solid #e0ddd8;cursor:grab;background:rgba(245,244,240,.97);border-radius:10px 10px 0 0;position:sticky;top:0;z-index:1}
#panel-header:active{cursor:grabbing}
#panel-title{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.07em}
#panel-toggle{font-size:16px;background:none;border:none;color:#aaa;cursor:pointer;padding:0 2px;line-height:1}
#panel-body{padding:10px 12px 14px}
.section{margin-bottom:12px}
.section:last-child{margin-bottom:0}
.sec-title{font-size:10px;font-weight:500;color:#aaa;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
.row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.row:last-child{margin-bottom:0}
.lbl{font-size:11px;color:#666;min-width:62px;flex-shrink:0}
.row input[type=range]{flex:1;min-width:0;accent-color:#3a7bd5;cursor:pointer;height:3px}
.val{font-size:11px;font-weight:500;color:#2c2c2a;min-width:40px;text-align:right;flex-shrink:0}
.row input[type=number]{width:56px;font-size:11px;padding:3px 6px;border:0.5px solid #ccc;border-radius:5px;background:#fff;color:#2c2c2a;text-align:right}
.btn-group{display:flex;flex-wrap:wrap;gap:4px}
button{font-size:11px;padding:4px 9px;border-radius:5px;border:0.5px solid #ccc;background:#fff;color:#2c2c2a;cursor:pointer;transition:background .12s}
button:hover{background:#f0eeea;border-color:#aaa}
button.on{background:#2c2c2a;color:#fff;border-color:#2c2c2a}
#play-btn{min-width:64px}
.hint{font-size:10px;color:#bbb;margin:2px 0 5px 62px;line-height:1.4}
.divider{height:0.5px;background:#eee;margin:7px 0}

/* ── Recording indicator ── */
#rec-indicator{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(200,30,30,.85);color:#fff;border-radius:6px;padding:5px 14px;font-size:12px;z-index:50;display:none;pointer-events:none}
#rec-indicator.active{display:block}

/* ── Action buttons (bottom right) ── */
#action-btns{position:fixed;bottom:20px;right:14px;display:flex;flex-direction:column;gap:7px;z-index:20}
#action-btns button{font-size:11px;padding:6px 12px;border-radius:7px;border:0.5px solid rgba(255,255,255,.2);background:rgba(0,0,0,.55);color:#fff;cursor:pointer;white-space:nowrap}
#action-btns button:hover{background:rgba(0,0,0,.75)}
#rec-btn.recording{background:rgba(180,20,20,.8);border-color:rgba(255,100,100,.4)}
</style>
</head>
<body>

<div id="viewport"><canvas id="c"></canvas></div>
<div id="filmframe"></div>

<div id="hud">
  <div id="hud-angle">0°</div>
  <div id="hud-pos">軸基点から</div>
  <div id="hud-lens">50mm &nbsp;|&nbsp; 1.5m</div>
  <div id="hud-extras"></div>
  <div id="hud-fov"></div>
</div>

<div id="zoom-btns">
  <button id="zoom-out" title="縮小">−</button>
  <button id="zoom-in"  title="拡大">+</button>
</div>
<div id="zoom-val">100%</div>

<div id="rec-indicator">● REC</div>

<div id="action-btns">
  <button id="reset-btn">リセット</button>
  <button id="rec-btn">MP4録画</button>
</div>

<!-- Floating panel -->
<div id="panel">
  <div id="panel-header">
    <span id="panel-title">カメラコントロール</span>
    <button id="panel-toggle">−</button>
  </div>
  <div id="panel-body">

    <div class="section">
      <div class="sec-title">軌道</div>
      <div class="row">
        <span class="lbl">公転角度</span>
        <input type="range" id="sl-angle" min="0" max="360" step="0.5" value="0">
        <span class="val" id="v-angle">0°</span>
      </div>
      <div class="row">
        <span class="lbl">距離 (m)</span>
        <input type="number" id="in-dist" min="0.2" max="30" step="0.1" value="1.5">
        <span class="val">m</span>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span class="lbl">自動回転</span>
        <button id="play-btn" class="on">&#9654; 再生</button>
        <button id="rev-btn">逆転</button>
      </div>
      <div class="row">
        <span class="lbl">速度</span>
        <input type="range" id="sl-speed" min="0.05" max="4" step="0.05" value="0.5">
        <span class="val" id="v-speed">0.50</span>
      </div>
    </div>

    <div class="section">
      <div class="sec-title">回転軸・カメラの向き</div>
      <div class="row">
        <span class="lbl">軸の仰角</span>
        <input type="range" id="sl-axelev" min="0" max="90" step="1" value="0">
        <span class="val" id="v-axelev">0°</span>
      </div>
      <div class="hint">0°=縦一周 / 45°=斜め / 90°=水平旋回</div>
      <div class="row">
        <span class="lbl">軸の向き</span>
        <input type="range" id="sl-axpan" min="-180" max="180" step="1" value="0">
        <span class="val" id="v-axpan">0°</span>
      </div>
      <div class="hint">0°=正面側 / 90°=右側面側</div>
      <div class="row">
        <span class="lbl">チルト</span>
        <input type="range" id="sl-tilt" min="-90" max="90" step="1" value="0">
        <span class="val" id="v-tilt">0°</span>
      </div>
      <div class="row">
        <span class="lbl">ロール</span>
        <input type="range" id="sl-roll" min="-180" max="180" step="1" value="0">
        <span class="val" id="v-roll">0°</span>
      </div>
    </div>

    <div class="section">
      <div class="sec-title">レンズ（35mm換算）</div>
      <div class="btn-group" id="lens-btns">
        <button data-mm="14">14mm</button>
        <button data-mm="24">24mm</button>
        <button data-mm="35">35mm</button>
        <button data-mm="50" class="on">50mm</button>
        <button data-mm="85">85mm</button>
        <button data-mm="105">105mm</button>
        <button data-mm="135">135mm</button>
        <button data-mm="200">200mm</button>
      </div>
      <div class="row" style="margin-top:7px">
        <span class="lbl">カスタム</span>
        <input type="number" id="in-mm" min="8" max="800" step="1" value="50">
        <span class="val">mm</span>
      </div>
    </div>

    <div class="section">
      <div class="sec-title">背景空間 (m)</div>
      <div class="row">
        <span class="lbl">幅</span>
        <input type="range" id="sl-bw" min="1" max="30" step="0.5" value="6">
        <span class="val" id="v-bw">6.0</span>
      </div>
      <div class="row">
        <span class="lbl">奥行き</span>
        <input type="range" id="sl-bd" min="1" max="30" step="0.5" value="6">
        <span class="val" id="v-bd">6.0</span>
      </div>
      <div class="row">
        <span class="lbl">高さ</span>
        <input type="range" id="sl-bh" min="1" max="15" step="0.5" value="3">
        <span class="val" id="v-bh">3.0</span>
      </div>
      <div class="divider"></div>
      <div class="btn-group" id="bg-btns">
        <button data-bg="sky" class="on">夏の空</button>
        <button data-bg="washitsu">和室</button>
        <button data-bg="gray">グレー</button>
        <button data-bg="beige">ベージュ</button>
      </div>
    </div>

    <div class="section">
      <div class="sec-title">録画設定</div>
      <div class="row">
        <span class="lbl">解像度</span>
        <select id="sel-res" style="font-size:11px;padding:3px 6px;border:0.5px solid #ccc;border-radius:5px;background:#fff;flex:1">
          <option value="720">720p</option>
          <option value="1080" selected>1080p</option>
        </select>
      </div>
      <div class="row">
        <span class="lbl">周回数</span>
        <input type="number" id="in-laps" min="1" max="10" step="1" value="1">
        <span class="val">周</span>
      </div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Renderer ──
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.005, 500);

// Zoom state — viewport size scale
let zoomScale = 1.0;

function applyZoom(){
  const vp = document.getElementById('viewport');
  const w = Math.round(innerWidth * zoomScale);
  const h = Math.round(innerHeight * zoomScale);
  const offX = Math.round((innerWidth - w) / 2);
  const offY = Math.round((innerHeight - h) / 2);
  vp.style.width  = w + 'px';
  vp.style.height = h + 'px';
  vp.style.left   = offX + 'px';
  vp.style.top    = offY + 'px';
  vp.style.right  = 'auto';
  vp.style.bottom = 'auto';
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  document.getElementById('zoom-val').textContent = Math.round(zoomScale * 100) + '%';
}

function resize(){
  if(zoomScale === 1.0){
    const vp = document.getElementById('viewport');
    vp.style.cssText = 'position:fixed;inset:0;background:#111';
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  } else {
    applyZoom();
  }
}

const SENSOR_H = 24;
function mmToFovV(mm){ return 2*Math.atan(SENSOR_H/(2*mm))*180/Math.PI; }
function mmToFovH(mm){ return 2*Math.atan(SENSOR_H*1.5/(2*mm))*180/Math.PI; }

// ── Default state ──
const DEFAULTS = {
  angle:90, dist:1.5, axElev:0, axPan:0, tilt:0, roll:0,
  mm:50, playing:true, direction:1, speed:0.5,
  bg:'sky', bw:6, bd:6, bh:3
};
let state = {...DEFAULTS};

// ── Lights ──
const ambLight = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambLight);
const sunLight = new THREE.DirectionalLight(0xfff8e0, 1.6);
sunLight.position.set(5,10,6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(1024,1024);
sunLight.shadow.camera.left=-10; sunLight.shadow.camera.right=10;
sunLight.shadow.camera.top=10; sunLight.shadow.camera.bottom=-10;
sunLight.shadow.camera.far=40;
scene.add(sunLight);
scene.add(new THREE.DirectionalLight(0xb0ccff, 0.35)).position.set(-5,3,-4);

// ── Room ──
let bgMeshes = [];
const PRESETS = {
  sky:     {floor:0x5a9e38,back:0x7ecbf5,side:0x8dd5f8,ceil:null,  fog:0x9ed8f5,fogD:0.025,amb:0x88bbcc,sun:0xfff5c0},
  washitsu:{floor:0x8a7048,back:0xd4b882,side:0xcfb278,ceil:0xe8d09a,fog:0xcaa86a,fogD:0.055,amb:0x997755,sun:0xffe8b0},
  gray:    {floor:0x8c8c8c,back:0xb4b4b4,side:0xb2b2b2,ceil:0xc6c6c6,fog:0xbbbbbb,fogD:0.05, amb:0x777777,sun:0xffffff},
  beige:   {floor:0xc8a87a,back:0xe8d8b8,side:0xe4d4b0,ceil:0xf0e4cc,fog:0xe0cfa8,fogD:0.05, amb:0xaa9070,sun:0xfff8e0},
};

function buildRoom(){
  bgMeshes.forEach(m=>{ scene.remove(m); m.geometry.dispose(); m.material.dispose(); });
  bgMeshes = [];
  const {bw,bd,bh,bg} = state;
  const p = PRESETS[bg]||PRESETS.gray;
  scene.background = new THREE.Color(p.fog);
  scene.fog = new THREE.FogExp2(p.fog, p.fogD);
  ambLight.color.set(p.amb); sunLight.color.set(p.sun);
  const hw=bw/2,hd=bd/2,fy=-0.36;
  const mk=(geo,col,rcv=true)=>{
    const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:col,side:THREE.FrontSide}));
    m.receiveShadow=rcv; scene.add(m); bgMeshes.push(m); return m;
  };
  const fl=mk(new THREE.PlaneGeometry(bw,bd),p.floor); fl.rotation.x=-Math.PI/2; fl.position.y=fy;
  const bk=mk(new THREE.PlaneGeometry(bw,bh),p.back); bk.position.set(0,fy+bh/2,-hd);
  const fw=mk(new THREE.PlaneGeometry(bw,bh),p.back,false); fw.rotation.y=Math.PI; fw.position.set(0,fy+bh/2,hd);
  const lw=mk(new THREE.PlaneGeometry(bd,bh),p.side); lw.rotation.y=Math.PI/2; lw.position.set(-hw,fy+bh/2,0);
  const rw=mk(new THREE.PlaneGeometry(bd,bh),p.side); rw.rotation.y=-Math.PI/2; rw.position.set(hw,fy+bh/2,0);
  if(p.ceil){ const cl=mk(new THREE.PlaneGeometry(bw,bd),p.ceil); cl.rotation.x=Math.PI/2; cl.position.y=fy+bh; }
  if(bg==='sky'){
    const dome=new THREE.Mesh(new THREE.SphereGeometry(40,20,10,0,Math.PI*2,0,Math.PI/2),new THREE.MeshBasicMaterial({color:0x4ab8f0,side:THREE.BackSide}));
    dome.position.y=fy; scene.add(dome); bgMeshes.push(dome);
    const grass=mk(new THREE.PlaneGeometry(80,80),0x5aaa38); grass.rotation.x=-Math.PI/2; grass.position.y=fy-0.001;
  }
  if(bg==='washitsu'){
    const wdM=new THREE.MeshLambertMaterial({color:0x6a4020});
    [-hd*0.4,hd*0.4].forEach(z=>{ const bm=new THREE.Mesh(new THREE.BoxGeometry(bw,0.05,0.09),wdM); bm.position.set(0,fy+bh-0.025,z); scene.add(bm); bgMeshes.push(bm); });
    [[-hw+0.04,-hd+0.04],[hw-0.04,-hd+0.04],[-hw+0.04,hd-0.04],[hw-0.04,hd-0.04]].forEach(([x,z])=>{ const pl=new THREE.Mesh(new THREE.BoxGeometry(0.08,bh,0.08),wdM); pl.position.set(x,fy+bh/2,z); scene.add(pl); bgMeshes.push(pl); });
    for(let i=1;i<4;i++){ const sh=new THREE.Mesh(new THREE.BoxGeometry(bw,0.02,0.01),new THREE.MeshLambertMaterial({color:0x5a3a18})); sh.position.set(0,fy+bh*i/4,-hd+0.01); scene.add(sh); bgMeshes.push(sh); }
  }
}

// ── Bucket ──
const bucketGroup = new THREE.Group(); scene.add(bucketGroup);
const woodM=new THREE.MeshStandardMaterial({color:0x8b6344,roughness:0.85,metalness:0});
const darkM=new THREE.MeshStandardMaterial({color:0x5a3e28,roughness:0.9,metalness:0});
const metalM=new THREE.MeshStandardMaterial({color:0x1a1a1a,metalness:0.85,roughness:0.25});
const body=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.32,0.28,32,1,true),woodM); body.position.y=0.14; body.castShadow=true; bucketGroup.add(body);
const bot=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.025,32),darkM); bot.position.y=0.013; bucketGroup.add(bot);
[{y:0.28,r:0.39},{y:0.01,r:0.38}].forEach(({y,r})=>{ const rg=new THREE.Mesh(new THREE.TorusGeometry(r,0.018,8,48),darkM); rg.position.y=y; rg.rotation.x=Math.PI/2; bucketGroup.add(rg); });
for(let i=0;i<24;i++){ const a=(i/24)*Math.PI*2; const sv=new THREE.Mesh(new THREE.BoxGeometry(0.007,0.3,0.007),darkM); sv.position.set(Math.sin(a)*0.356,0.14,Math.cos(a)*0.356); sv.rotation.y=-a; sv.castShadow=true; bucketGroup.add(sv); }
[0.06,0.18].forEach(y=>{ const tg=new THREE.Mesh(new THREE.TorusGeometry(0.362,0.013,7,48),metalM); tg.position.y=y; tg.rotation.x=Math.PI/2; bucketGroup.add(tg); });
const waterM=new THREE.MeshStandardMaterial({color:0xc0e4ee,roughness:0.08,metalness:0.15,transparent:true,opacity:0.85});
const waterMesh=new THREE.Mesh(new THREE.CircleGeometry(0.352,48),waterM); waterMesh.rotation.x=-Math.PI/2; waterMesh.position.y=0.25; bucketGroup.add(waterMesh);
const noodleM=new THREE.MeshStandardMaterial({color:0xf5e8b4,roughness:0.65});
for(let n=0;n<10;n++){ const a=(n/10)*Math.PI*2; const r=0.04+(n%4)*0.07; const ng=new THREE.TorusGeometry(r,0.023,5,28,Math.PI*(1.2+Math.random()*0.8)); const nd=new THREE.Mesh(ng,noodleM); nd.position.set(Math.sin(a)*0.06,0.25,Math.cos(a)*0.06); nd.rotation.x=-Math.PI/2+(Math.random()-.5)*0.25; nd.rotation.z=a+(Math.random()-.5)*0.4; nd.castShadow=true; bucketGroup.add(nd); }
const glassM=new THREE.MeshPhysicalMaterial({color:0xd0eef8,transparent:true,opacity:0.16,roughness:0.02,transmission:0.92});
const glassMesh=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.05,1.5),glassM); glassMesh.position.y=-0.03; scene.add(glassMesh);
const legM=new THREE.MeshStandardMaterial({color:0xaaaaaa,metalness:0.75,roughness:0.25});
[[0.85,0.6],[0.85,-0.6],[-0.85,0.6],[-0.85,-0.6]].forEach(([x,z])=>{ const lg=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.31,10),legM); lg.position.set(x,-0.19,z); scene.add(lg); });

// ── Camera orbit (Rodrigues) ──
const TARGET = new THREE.Vector3(0, 0.14, 0);

function updateCamera(){
  const {angle,dist,axElev,axPan,tilt,roll,mm} = state;
  const orbitRad=(angle*Math.PI)/180, elevRad=(axElev*Math.PI)/180, panRad=(axPan*Math.PI)/180;
  const axX=Math.cos(elevRad)*Math.cos(panRad), axY=Math.sin(elevRad), axZ=-Math.cos(elevRad)*Math.sin(panRad);
  const axLen=Math.sqrt(axX*axX+axY*axY+axZ*axZ)||1;
  const nx=axX/axLen, ny=axY/axLen, nz=axZ/axLen;
  let bx,by,bz;
  if(Math.abs(ny)<0.99){ const cx2=ny*0-nz*1,cy2=nz*0-nx*0,cz2=nx*1-ny*0; const cl=Math.sqrt(cx2*cx2+cy2*cy2+cz2*cz2)||1; bx=cx2/cl;by=cy2/cl;bz=cz2/cl; }
  else { const cx2=ny*1-nz*0,cy2=nz*0-nx*1,cz2=nx*0-ny*0; const cl=Math.sqrt(cx2*cx2+cy2*cy2+cz2*cz2)||1; bx=cx2/cl;by=cy2/cl;bz=cz2/cl; }
  const cos=Math.cos(orbitRad),sin=Math.sin(orbitRad);
  const crossX=ny*bz-nz*by, crossY=nz*bx-nx*bz, crossZ=nx*by-ny*bx;
  const rx=bx*cos+crossX*sin, ry=by*cos+crossY*sin, rz=bz*cos+crossZ*sin;
  const effectiveDist = dist;
  camera.position.set(TARGET.x+rx*effectiveDist, TARGET.y+ry*effectiveDist, TARGET.z+rz*effectiveDist);
  camera.up.set(-bx*sin+crossX*cos, -by*sin+crossY*cos, -bz*sin+crossZ*cos);
  camera.lookAt(TARGET);
  if(tilt!==0) camera.rotateX(-(tilt*Math.PI)/180);
  if(roll!==0) camera.rotateZ((roll*Math.PI)/180);
  camera.fov=mmToFovV(mm); camera.updateProjectionMatrix();

  const deg=((angle%360)+360)%360;
  document.getElementById('hud-angle').textContent=Math.round(deg)+'°';
  document.getElementById('hud-pos').textContent=posLabel(deg,axElev);
  document.getElementById('hud-lens').textContent=mm+'mm  |  '+dist.toFixed(1)+'m';
  const extras=[];
  if(axElev!==0) extras.push('軸仰角 +'+axElev+'°');
  if(axPan!==0)  extras.push('軸向き '+(axPan>0?'+':'')+axPan+'°');
  if(tilt!==0)   extras.push('チルト '+(tilt>0?'+':'')+tilt+'°');
  if(roll!==0)   extras.push('ロール '+(roll>0?'+':'')+roll+'°');
  document.getElementById('hud-extras').textContent=extras.join('   ');
  document.getElementById('hud-fov').textContent='vFOV '+mmToFovV(mm).toFixed(1)+'°   hFOV '+mmToFovH(mm).toFixed(1)+'°';
  document.getElementById('v-angle').textContent=Math.round(deg)+'°';
  document.getElementById('sl-angle').value=deg;
}

function posLabel(deg,axElev){
  if(axElev>=85) return '水平旋回 ('+Math.round(deg)+'°)';
  if(deg<8||deg>=352) return '軸基点 (0°)';
  if(deg<98) return '前方 ('+Math.round(deg)+'°)';
  if(deg<188) return '裏側 ('+Math.round(deg)+'°)';
  if(deg<278) return '後方 ('+Math.round(deg)+'°)';
  return '上方 ('+Math.round(deg)+'°)';
}

buildRoom(); updateCamera();

// ── Recording state (must be declared before animate) ──
let isRecording=false, mediaRecorder=null, recChunks=[];

// ── Animate ──
let lastT=0;
function animate(t){
  requestAnimationFrame(animate);
  const dt=Math.min(t-lastT,50); lastT=t;
  if(state.playing && !isRecording){
    state.angle=(state.angle+state.direction*state.speed*dt/16.67);
    if(state.angle>=360) state.angle-=360;
    if(state.angle<0)    state.angle+=360;
  }
  waterMesh.material.opacity=0.80+Math.sin(t*0.002)*0.05;
  updateCamera();
  renderer.render(scene,camera);
}
resize(); window.addEventListener('resize',resize); animate(0);

// ── Reset ──
function applyStateToUI(){
  document.getElementById('sl-angle').value=state.angle;
  document.getElementById('v-angle').textContent=Math.round(state.angle)+'°';
  document.getElementById('in-dist').value=state.dist.toFixed(1);
  document.getElementById('sl-speed').value=state.speed;
  document.getElementById('v-speed').textContent=state.speed.toFixed(2);
  document.getElementById('sl-axelev').value=state.axElev;
  document.getElementById('v-axelev').textContent='+'+state.axElev+'°';
  document.getElementById('sl-axpan').value=state.axPan;
  document.getElementById('v-axpan').textContent=(state.axPan>0?'+':'')+state.axPan+'°';
  document.getElementById('sl-tilt').value=state.tilt;
  document.getElementById('v-tilt').textContent=(state.tilt>0?'+':'')+state.tilt+'°';
  document.getElementById('sl-roll').value=state.roll;
  document.getElementById('v-roll').textContent=(state.roll>0?'+':'')+state.roll+'°';
  document.getElementById('in-mm').value=state.mm;
  document.querySelectorAll('#lens-btns button').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.mm)===state.mm));
  document.getElementById('sl-bw').value=state.bw; document.getElementById('v-bw').textContent=state.bw.toFixed(1);
  document.getElementById('sl-bd').value=state.bd; document.getElementById('v-bd').textContent=state.bd.toFixed(1);
  document.getElementById('sl-bh').value=state.bh; document.getElementById('v-bh').textContent=state.bh.toFixed(1);
  document.querySelectorAll('#bg-btns button').forEach(b=>b.classList.toggle('on',b.dataset.bg===state.bg));
  document.getElementById('play-btn').textContent=state.playing?'▶ 再生':'⏸ 停止';
  document.getElementById('play-btn').classList.toggle('on',state.playing);
  zoomScale=1.0;
  const vp=document.getElementById('viewport');
  vp.style.cssText='position:fixed;inset:0;background:#111';
  document.getElementById('zoom-val').textContent='100%';
}
document.getElementById('reset-btn').addEventListener('click',()=>{
  state={...DEFAULTS}; buildRoom(); applyStateToUI(); updateCamera();
});

// ── Zoom ──
document.getElementById('zoom-in').addEventListener('click',()=>{
  zoomScale=Math.min(zoomScale*1.25,4);
  applyZoom();
});
document.getElementById('zoom-out').addEventListener('click',()=>{
  zoomScale=Math.max(zoomScale/1.25,0.25);
  applyZoom();
});

document.getElementById('rec-btn').addEventListener('click',()=>{
  if(isRecording){ stopRecording(); return; }
  startRecording();
});

function startRecording(){
  const resH=parseInt(document.getElementById('sel-res').value);
  const resW=Math.round(resH*16/9);
  const laps=parseInt(document.getElementById('in-laps').value)||1;
  const totalDeg=360*laps;
  const degPerFrame=state.speed*(state.direction||1);

  // オフスクリーンキャンバスを使わず、既存canvasをそのまま使う
  const stream=canvas.captureStream(30);
  const opts=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'video/webm';
  mediaRecorder=new MediaRecorder(stream,{mimeType:opts,videoBitsPerSecond:8000000});
  recChunks=[];
  mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recChunks.push(e.data); };
  mediaRecorder.onstop=()=>{ exportVideo(recChunks, opts); };
  mediaRecorder.start(100);

  isRecording=true;
  document.getElementById('rec-btn').textContent='■ 停止';
  document.getElementById('rec-btn').classList.add('recording');
  document.getElementById('rec-indicator').classList.add('active');

  // 自動で指定周回分回してから停止
  const startAngle=state.angle;
  let accumulated=0;
  const prevPlaying=state.playing;
  state.playing=false;

  const recStep=()=>{
    if(!isRecording) return;
    state.angle=(state.angle+Math.abs(state.speed)*state.direction+360)%360;
    accumulated+=Math.abs(state.speed);
    updateCamera();
    renderer.render(scene,camera);
    if(accumulated<totalDeg){ requestAnimationFrame(recStep); }
    else{ stopRecording(); state.playing=prevPlaying; }
  };
  requestAnimationFrame(recStep);
}

function stopRecording(){
  if(!isRecording) return;
  isRecording=false;
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
  document.getElementById('rec-btn').textContent='MP4録画';
  document.getElementById('rec-btn').classList.remove('recording');
  document.getElementById('rec-indicator').classList.remove('active');
}

function exportVideo(chunks, mimeType){
  const blob=new Blob(chunks,{type:mimeType});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='udon_camera_'+(new Date().toISOString().slice(0,16).replace(/:/g,'-'))+'.webm';
  a.click(); URL.revokeObjectURL(url);
}

// ── Floating panel drag ──
const panel=document.getElementById('panel');
const header=document.getElementById('panel-header');
let dragging=false, dragOX=0, dragOY=0;
header.addEventListener('mousedown',e=>{
  const rect=panel.getBoundingClientRect();
  dragging=true; dragOX=e.clientX-rect.left; dragOY=e.clientY-rect.top;
  panel.style.bottom='auto'; panel.style.top=rect.top+'px'; panel.style.left=rect.left+'px';
  e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(!dragging) return;
  let x=e.clientX-dragOX, y=e.clientY-dragOY;
  x=Math.max(0,Math.min(x,innerWidth-panel.offsetWidth));
  y=Math.max(0,Math.min(y,innerHeight-40));
  panel.style.left=x+'px'; panel.style.top=y+'px'; panel.style.right='auto';
});
window.addEventListener('mouseup',()=>{ dragging=false; });

// Touch drag
header.addEventListener('touchstart',e=>{ const t=e.touches[0]; const rect=panel.getBoundingClientRect(); dragging=true; dragOX=t.clientX-rect.left; dragOY=t.clientY-rect.top; panel.style.bottom='auto'; panel.style.top=rect.top+'px'; panel.style.left=rect.left+'px'; },{passive:true});
window.addEventListener('touchmove',e=>{ if(!dragging) return; const t=e.touches[0]; let x=t.clientX-dragOX,y=t.clientY-dragOY; x=Math.max(0,Math.min(x,innerWidth-panel.offsetWidth)); y=Math.max(0,Math.min(y,innerHeight-40)); panel.style.left=x+'px'; panel.style.top=y+'px'; panel.style.right='auto'; },{passive:true});
window.addEventListener('touchend',()=>{ dragging=false; });

// Panel collapse
let panelOpen=true;
document.getElementById('panel-toggle').addEventListener('click',()=>{
  panelOpen=!panelOpen;
  document.getElementById('panel-body').style.display=panelOpen?'block':'none';
  document.getElementById('panel-toggle').textContent=panelOpen?'−':'+';
});

// ── UI bindings ──
document.getElementById('sl-angle').addEventListener('input',e=>{ state.angle=parseFloat(e.target.value); updateCamera(); });
document.getElementById('in-dist').addEventListener('change',e=>{ const v=Math.max(0.2,parseFloat(e.target.value)||1.5); state.dist=v; e.target.value=v.toFixed(1); updateCamera(); });
document.getElementById('sl-speed').addEventListener('input',e=>{ state.speed=parseFloat(e.target.value); document.getElementById('v-speed').textContent=state.speed.toFixed(2); });
document.getElementById('play-btn').addEventListener('click',()=>{ state.playing=!state.playing; document.getElementById('play-btn').textContent=state.playing?'▶ 再生':'⏸ 停止'; document.getElementById('play-btn').classList.toggle('on',state.playing); });
document.getElementById('rev-btn').addEventListener('click',()=>{ state.direction*=-1; document.getElementById('rev-btn').classList.toggle('on',state.direction===-1); });
document.getElementById('sl-axelev').addEventListener('input',e=>{ state.axElev=parseFloat(e.target.value); document.getElementById('v-axelev').textContent='+'+state.axElev+'°'; updateCamera(); });
document.getElementById('sl-axpan').addEventListener('input',e=>{ state.axPan=parseFloat(e.target.value); document.getElementById('v-axpan').textContent=(state.axPan>0?'+':'')+state.axPan+'°'; updateCamera(); });
document.getElementById('sl-tilt').addEventListener('input',e=>{ state.tilt=parseFloat(e.target.value); document.getElementById('v-tilt').textContent=(state.tilt>0?'+':'')+state.tilt+'°'; updateCamera(); });
document.getElementById('sl-roll').addEventListener('input',e=>{ state.roll=parseFloat(e.target.value); document.getElementById('v-roll').textContent=(state.roll>0?'+':'')+state.roll+'°'; updateCamera(); });
document.querySelectorAll('#lens-btns button').forEach(btn=>{ btn.addEventListener('click',()=>{ document.querySelectorAll('#lens-btns button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); state.mm=parseInt(btn.dataset.mm); document.getElementById('in-mm').value=state.mm; updateCamera(); }); });
document.getElementById('in-mm').addEventListener('change',e=>{ const v=Math.min(800,Math.max(8,parseInt(e.target.value)||50)); state.mm=v; e.target.value=v; document.querySelectorAll('#lens-btns button').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.mm)===v)); updateCamera(); });
['bw','bd','bh'].forEach(k=>{ document.getElementById('sl-'+k).addEventListener('input',e=>{ state[k]=parseFloat(e.target.value); document.getElementById('v-'+k).textContent=state[k].toFixed(1); buildRoom(); }); });
document.querySelectorAll('#bg-btns button').forEach(btn=>{ btn.addEventListener('click',()=>{ document.querySelectorAll('#bg-btns button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); state.bg=btn.dataset.bg; buildRoom(); }); });
</script>
